name: CI/CD Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: ventas-app

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Give execute permission to mvnw
        run: chmod +x ./mvnw

      - name: Build con Maven
        run: ./mvnw --batch-mode -DskipTests package

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build y Push a Docker Hub
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Desplegar en EC2 via SSM
        run: |
          aws ssm send-command \
            --instance-ids ${{ secrets.EC2_BACKEND_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --comment "Actualizar ventas-backend desde Docker Hub" \
            --parameters '{"commands":[
              "docker pull ${{ secrets.DOCKERHUB_USERNAME }}/ventas-app:latest",
              "docker stop ventas-app || true",
              "docker rm ventas-app || true",
              "docker run -d --name ventas-app -p 8080:8080 \
                -e DB_ENDPOINT=db \
                -e DB_PORT=3306 \
                -e DB_NAME=ventasdb \
                -e DB_USERNAME=ventasuser \
                -e DB_PASSWORD=ventaspass \
                ${{ secrets.DOCKERHUB_USERNAME }}/ventas-app:latest"
            ]}' \
            --output text